<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--

<title>Phasy 教處理</title>
<style>
  :root {
    --bg: #eef1f4; --card: rgba(255,255,255,.94); --ink: #1d232a; --muted: #5d6771; --line: #d5dae0;
    --accent: #0e7490; --accent-soft: #e0f2f5; --warn: #9a3412; --warn-bg: #fff7ed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9dee4; color: var(--ink);
    font: 16px/1.55 "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  #stage { position: fixed; inset: 0; background: radial-gradient(120% 80% at 50% 30%, #eef1f4, #d9dee4); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 8px;
    padding: 6px 16px; padding-top: max(6px, env(safe-area-inset-top)); background: #fff; border-bottom: 1px solid var(--line); }
  header strong { font-size: 18px; }
  #who { flex: 1; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .views { position: fixed; top: calc(48px + env(safe-area-inset-top)); right: 12px; z-index: 3; display: flex; gap: 6px; }
  .bottom { position: fixed; left: 12px; right: 12px; bottom: max(8px, env(safe-area-inset-bottom)); z-index: 3;
    max-height: 58%; overflow: auto; -webkit-overflow-scrolling: touch; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  h1 { font-size: 20px; line-height: 1.3; margin: 0 0 8px; }
  h2 { font-size: 16px; margin: 12px 0 6px; }
  h3 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 6px 0; }
  button { font: inherit; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; touch-action: manipulation; }
  button:active { background: #eef2f5; }
  button.primary { display: block; width: 100%; margin-top: 12px; background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600; }
  button.wide { display: block; width: 100%; margin-top: 8px; }
  button.back { min-height: 40px; margin: 0 0 8px; padding: 4px 8px; border: 0; background: none; color: var(--accent); }
  button:disabled { opacity: .45; }
  .hint { color: var(--muted); font-size: 14px; }
  .en { color: var(--muted); font-size: 13px; margin: 0; }
  .circle { color: #0b4f5f; }
  .src { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .note { font-size: 14px; color: var(--muted); background: #e9edf1; border-radius: 8px; padding: 6px 10px; margin: 8px 0; }
  .tag { display: inline-block; font-size: 12px; background: #e9edf1; color: var(--ink); border-radius: 6px;
    padding: 0 6px; margin-right: 4px; }
  dl { margin: 4px 0 0; }
  dt { font-weight: 600; margin-top: 8px; }
  dd { margin: 2px 0 0; }
  dl.ra { display: grid; grid-template-columns: 5.5em 1fr; gap: 4px 8px; background: #f7f9fa; border-radius: 10px; padding: 8px 10px; }
  dl.ra dt, dl.ra dd { margin: 0; }
  ol { margin: 6px 0; padding-left: 1.4em; }
  ol li.on { background: var(--accent-soft); border-radius: 8px; padding: 2px 6px; margin-left: -6px; }
  .timer { background: #fff; border: 2px solid var(--accent); border-radius: 14px; padding: 8px 10px; margin-top: 10px; }
  .timer .clock { font-size: 28px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .choices button { flex: 1 1 22%; padding: 6px 4px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; z-index: 2; }
  .credit { margin-top: 8px; font-size: 10px; color: var(--muted); text-align: center; }
  .credit a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <strong>Phasy</strong><span id="who">教處理（沒有影片）</span>
</header>
<div id="stage"></div>
<div id="loading">載入肌肉模型中… <span id="pct"></span></div>
<div class="views">
  <button id="front" type="button">正面</button>
  <button id="back" type="button">背面</button>
</div>
<div class="bottom">
  <div class="card" id="panel">
    <main id="main" data-n="0"></main>
    <p class="credit">3D 模型：BodyParts3D, © The Database Center for Life Science licensed under
      <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC Attribution 4.0 International</a></p>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
