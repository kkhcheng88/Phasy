<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  PROTOTYPE (throwaway) — ticket 10: does a Session feel like reasoning with a physiotherapist?
  Run on the PC:  node server.mjs   then open the printed LAN URL on the phone (same Wi-Fi).
  ?lib=<path> loads another Library file (tests use test/library.stub.json).
-->
<title>Phasy 一節</title>
<style>
  :root {
    --bg: #f3f5f7; --card: #fff; --ink: #1d232a; --muted: #5d6771; --line: #d5dae0;
    --accent: #0e7490; --accent-soft: #e0f2f5; --warn: #9a3412; --warn-bg: #fff7ed;
    --unchecked: #b8b2ac; --suspect: #7c3aed;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  header { display: flex; align-items: center; gap: 8px;
    padding: 6px 16px; padding-top: max(6px, env(safe-area-inset-top)); background: #fff; border-bottom: 1px solid var(--line); }
  header strong { font-size: 18px; }
  #who { flex: 1; color: var(--muted); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button { min-height: 44px; padding: 6px 12px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px 48px; }
  .banner { background: var(--warn-bg); color: var(--warn); border: 1px solid #fed7aa; border-radius: 12px;
    padding: 8px 12px; margin: 10px 0 0; font-size: 15px; }
  #steps { margin: 12px 0 0; font-size: 15px; color: var(--muted); }
  #steps .bar { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 6px; }
  #steps .bar i { height: 5px; border-radius: 3px; background: var(--line); }
  #steps .bar i.on { background: var(--accent); }
  h1 { font-size: 22px; line-height: 1.35; margin: 16px 0 8px; }
  h2 { font-size: 18px; margin: 22px 0 8px; }
  h3 { font-size: 17px; margin: 0 0 4px; }
  .choices + h3 { margin-top: 14px; }
  p { margin: 8px 0; }
  button { font: inherit; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; touch-action: manipulation; }
  button:active { background: #eef2f5; }
  button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: #0b4f5f; font-weight: 600; }
  button.primary { display: block; width: 100%; margin-top: 22px; background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600; }
  button.wide { display: block; width: 100%; margin-top: 10px; }
  button:disabled { opacity: .45; cursor: default; }
  button.back { min-height: 44px; margin-top: 10px; padding: 6px 10px; border: 0; background: none; color: var(--accent); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices.col > button { flex: 1 1 100%; text-align: left; }
  .scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .scale button { padding: 0; font-variant-numeric: tabular-nums; }
  .scale button[aria-pressed="true"] { background: var(--c); border: 2px solid var(--ink); color: var(--ink); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
  .en { color: var(--muted); font-size: 14px; margin: 0; }
  dl { margin: 6px 0 0; }
  dt { font-weight: 600; margin-top: 10px; }
  dd { margin: 2px 0 0; }
  dl.ra { display: grid; grid-template-columns: 5.5em 1fr; gap: 4px 8px; background: #f7f9fa; border-radius: 10px; padding: 8px 10px; }
  dl.ra dt, dl.ra dd { margin: 0; }
  ol { margin: 6px 0; padding-left: 1.4em; }
  .hint { color: var(--muted); font-size: 15px; }
  .why { background: #f5f3ff; border-left: 4px solid var(--suspect); padding: 8px 12px; border-radius: 8px; }
  .circle { color: #0b4f5f; }
  .src { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .note { font-size: 14px; color: var(--muted); background: #e9edf1; border-radius: 8px; padding: 6px 10px; margin: 12px 0 0; }
  .tag { display: inline-block; font-size: 13px; line-height: 1.5; background: var(--suspect); color: #fff; border-radius: 6px;
    padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
  .tag.plain { background: #e9edf1; color: var(--ink); }
  .sw { display: inline-block; width: 20px; height: 14px; border-radius: 4px; vertical-align: -1px; margin-right: 6px; flex: none; }
  .sw.un { background: var(--unchecked); }
  .sw.su { background: repeating-linear-gradient(135deg, var(--suspect) 0 3px, var(--unchecked) 3px 7px); }
  .grad { display: inline-block; width: 96px; height: 10px; border-radius: 3px; vertical-align: 1px;
    background: linear-gradient(90deg, #22c55e, #facc15, #dc2626); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.between { justify-content: space-between; }
  .stat { display: inline-flex; align-items: center; min-width: 4.2em; font-variant-numeric: tabular-nums; }
  .stopnote { color: #b91c1c; font-weight: 600; margin: 6px 0 0; }
  .delta { font-variant-numeric: tabular-nums; font-weight: 600; }
  label { display: block; margin-top: 14px; font-weight: 600; }
  label > input, label > select, label > .keyrow { margin-top: 6px; font-weight: 400; }
  input, select, textarea { font: inherit; width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: #fff; color: var(--ink); }
  textarea { min-height: 120px; resize: vertical; }
  .keyrow { display: flex; gap: 8px; }
  .keyrow input { flex: 1; min-width: 0; }
  details { margin-top: 14px; }
  summary { min-height: 44px; display: flex; align-items: center; color: var(--accent); cursor: pointer; }
  .timer { background: #fff; border: 2px solid var(--accent); border-radius: 14px; padding: 10px 12px; margin-top: 16px; }
  .timer .clock { font-size: 30px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .timer .choices button { flex: 1 1 22%; padding: 6px 4px; }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); }
  .spin { width: 36px; height: 36px; margin: 0 auto 14px; border: 4px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <strong>Phasy</strong><span id="who"></span>
  <button id="open-settings" type="button">設定</button>
</header>
<div class="wrap">
  <div id="noai" class="banner" hidden>未連接 AI：現在用預設做法，仍然可以完成整節。可在「設定」輸入 API 金鑰。</div>
  <div id="flow">
    <nav id="steps" aria-label="步驟"></nav>
    <main id="main" data-n="0"></main>
  </div>
  <section id="settings" hidden>
    <h1>AI 設定</h1>
    <label>端點網址<input id="set-base" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label>模型<input id="set-model" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label>推理深度<select id="set-effort">
      <option value="">不傳送</option><option value="none">關閉思考</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="max">max</option>
    </select></label>
    <p class="hint">思考越深，每一步等得越久。</p>
    <label>API 金鑰<div class="keyrow">
      <input id="set-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="set-show" type="button">顯示</button>
    </div></label>
    <p class="hint">金鑰只保存在這部手機，只會放在發給上面網址的請求中，不會寫入紀錄。改動會自動保存。</p>
    <button id="set-test" class="primary" type="button">測試連線</button>
    <p id="set-result" role="status"></p>
    <button id="set-close" class="wide" type="button">完成</button>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
